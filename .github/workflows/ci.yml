name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: test (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Mage
        shell: bash
        run: |
          go install github.com/magefile/mage@v1.17.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run canonical local gate
        shell: bash
        run: mage ci

  integration:
    name: integration + external goldens (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Mage
        shell: bash
        run: |
          go install github.com/magefile/mage@v1.17.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run Docker-backed integration and external golden tests
        shell: bash
        run: mage integration
