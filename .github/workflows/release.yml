name: release

# Tag-gated release pipeline. Triggers only on `v*` tag pushes (e.g. `v0.1.0`).
# Cross-compiles `valv` for darwin/amd64 + darwin/arm64 and attaches the
# binaries to the GitHub Release.
#
# Mage-discipline exception: this workflow invokes `go build` directly with
# `GOOS`/`GOARCH` overrides because `mage build` produces only a host-arch
# binary. Cross-compile is a release-engineering concern, not dev workflow;
# adding a `mage:Release` matrix target is post-MVP polish.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # needed for release create + asset upload

jobs:
  build:
    name: build (darwin/${{ matrix.goarch }})
    runs-on: macos-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-compile valv binary
        shell: bash
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          BINARY="valv-darwin-${GOARCH}"
          go build -trimpath -ldflags="-s -w" -o "${BINARY}" ./cmd/valv
          ls -la "${BINARY}"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: valv-darwin-${{ matrix.goarch }}
          path: valv-darwin-${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: create GitHub release
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp dist/valv-darwin-amd64/valv-darwin-amd64 release-assets/
          cp dist/valv-darwin-arm64/valv-darwin-arm64 release-assets/
          cd release-assets
          shasum -a 256 valv-darwin-amd64 valv-darwin-arm64 > checksums.txt
          ls -la
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            release-assets/valv-darwin-amd64
            release-assets/valv-darwin-arm64
            release-assets/checksums.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
